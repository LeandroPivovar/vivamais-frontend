    <script>
      (function() {
        function applyFavicon() {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var link = document.getElementById('app-favicon') || document.querySelector("link[rel*='icon']");
          if (link) {
            link.href = isDark ? '/favicon-white.png' : '/favicon.png';
          }
        }
        applyFavicon();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyFavicon);
        }
      })();
    </script>
